<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI — Next Gen Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===================== RESET & VARIABLES ===================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg:             #080c12;
  --bg-alt:         #0d1117;
  --surface:        rgba(16, 22, 32, 0.72);
  --surface-raised: rgba(20, 28, 42, 0.85);
  --border:         rgba(255, 255, 255, 0.07);
  --border-strong:  rgba(255, 255, 255, 0.13);
  --accent:         #38bdf8;
  --accent-dim:     rgba(56, 189, 248, 0.15);
  --accent-glow:    rgba(56, 189, 248, 0.35);
  --text:           #e2e8f0;
  --text-muted:     rgba(226, 232, 240, 0.45);
  --text-faint:     rgba(226, 232, 240, 0.24);
  --online:         #34d399;
  --online-dim:     rgba(52, 211, 153, 0.18);
  --danger:         #f87171;
  --radius-sm:      8px;
  --radius-md:      12px;
  --radius-lg:      16px;
  --radius-xl:      22px;
  --sidebar-w:      268px;
  --shadow-sm:      0 1px 8px rgba(0,0,0,0.4);
  --shadow-md:      0 4px 24px rgba(0,0,0,0.5);
  --shadow-glow:    0 0 32px rgba(56,189,248,0.25);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Urbanist', sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* ===================== BACKGROUND ===================== */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.bg-layer::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 65% 55% at 15% 25%, rgba(56,189,248,0.09) 0%, transparent 60%),
    radial-gradient(ellipse 55% 60% at 85% 75%, rgba(99,102,241,0.07) 0%, transparent 60%);
  animation: ambient 18s ease-in-out infinite alternate;
}

@keyframes ambient {
  0%   { opacity: 0.6; }
  100% { opacity: 1.0; }
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.25;
}

/* ===================== LAYOUT ===================== */
.app {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
}

/* ===================== SIDEBAR ===================== */
.sidebar {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-right: 1px solid var(--border);
  overflow: hidden;
  animation: slide-in-left 0.5s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes slide-in-left {
  from { transform: translateX(-100%); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}

/* Brand */
.sidebar-brand {
  padding: 22px 18px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 16px;
}

.logo-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px var(--accent-glow);
  animation: logo-pulse 4s ease-in-out infinite;
}

@keyframes logo-pulse {
  0%,100% { box-shadow: 0 0 20px var(--accent-glow); }
  50%      { box-shadow: 0 0 36px rgba(56,189,248,0.55); }
}

.logo-mark svg {
  width: 18px;
  height: 18px;
  color: white;
}

.logo-info {
  min-width: 0;
}

.logo-name {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(130deg, #fff 20%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}

.logo-sub {
  font-size: 10.5px;
  color: var(--text-faint);
  font-weight: 500;
  letter-spacing: 0.4px;
  margin-top: 2px;
}

.btn-new-chat {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--surface-raised);
  color: var(--text);
  font-family: 'Urbanist', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}

.btn-new-chat:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: translateY(-1px);
}

.btn-new-chat svg {
  width: 14px;
  height: 14px;
}

/* Chat list */
.chat-history {
  flex: 1;
  overflow-y: auto;
  padding: 10px 8px 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(56,189,248,0.25) transparent;
}

.chat-history::-webkit-scrollbar { width: 3px; }
.chat-history::-webkit-scrollbar-thumb {
  background: rgba(56,189,248,0.3);
  border-radius: 3px;
}

.history-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  padding: 14px 8px 5px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  margin-bottom: 2px;
}

.chat-item:hover {
  background: rgba(255,255,255,0.04);
  border-color: var(--border);
}

.chat-item.active {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.3);
}

.chat-item-info {
  flex: 1;
  min-width: 0;
}

.chat-item-title {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.chat-item.active .chat-item-title {
  color: var(--accent);
  font-weight: 600;
}

.chat-item-time {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
}

.btn-delete-chat {
  opacity: 0;
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 5px;
  color: var(--text-muted);
  transition: all 0.2s;
  flex-shrink: 0;
  font-size: 13px;
}

.chat-item:hover .btn-delete-chat {
  opacity: 1;
}

.btn-delete-chat:hover {
  background: rgba(248,113,113,0.15);
  color: var(--danger);
}

.btn-delete-chat svg {
  width: 13px;
  height: 13px;
  display: block;
}

/* Sidebar footer */
.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  padding: 0;
}

.icon-btn img {
  width: 15px;
  height: 15px;
  object-fit: contain;
  filter: brightness(0.7);
  transition: filter 0.2s;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--border-strong);
}

.icon-btn:hover img {
  filter: brightness(1.1);
}

.icon-btn:active {
  transform: scale(0.95);
}

.sidebar-footer-fill {
  flex: 1;
}

/* ===================== MAIN AREA ===================== */
.main-area {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
}

/* Header */
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  animation: fade-down 0.5s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes fade-down {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s;
}

.menu-btn:hover { color: var(--text); }
.menu-btn svg { width: 18px; height: 18px; display: block; }

.chat-title-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  background: var(--online-dim);
  border: 1px solid rgba(52,211,153,0.25);
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--online);
  letter-spacing: 0.2px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--online);
  box-shadow: 0 0 8px var(--online);
  animation: blink 2.5s ease-in-out infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.25; }
}

#clock {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  min-width: 60px;
  text-align: right;
}

/* ===================== MESSAGES ===================== */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  scrollbar-width: thin;
  scrollbar-color: rgba(56,189,248,0.2) transparent;
  scroll-behavior: smooth;
  animation: fade-up 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb {
  background: rgba(56,189,248,0.25);
  border-radius: 4px;
}

/* Welcome screen */
.welcome-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 20px;
  text-align: center;
  padding: 40px 20px;
}

.welcome-orb {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, var(--accent), #6366f1 55%, #0f172a);
  box-shadow: 0 0 50px var(--accent-glow), 0 0 100px rgba(99,102,241,0.2);
  animation: orb-float 4.5s ease-in-out infinite;
  margin-bottom: 4px;
}

@keyframes orb-float {
  0%,100% { transform: translateY(0)    scale(1); }
  50%      { transform: translateY(-12px) scale(1.05); }
}

.welcome-screen h1 {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1.2px;
  line-height: 1.1;
  background: linear-gradient(130deg, #fff 20%, var(--accent) 70%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.welcome-screen p {
  color: var(--text-muted);
  font-size: 15px;
  max-width: 380px;
  line-height: 1.65;
  font-weight: 400;
}

.suggestions-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 560px;
  margin-top: 10px;
}

.suggestion-chip {
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter: blur(8px);
}

.suggestion-chip:hover {
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-dim);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px var(--accent-glow);
}

/* Message bubbles */
.msg {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: msg-in 0.35s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes msg-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.msg.ai .msg-avatar {
  background: linear-gradient(135deg, var(--accent), #6366f1);
  box-shadow: 0 0 14px var(--accent-glow);
}

.msg.ai .msg-avatar svg {
  width: 15px;
  height: 15px;
  color: white;
}

.msg.user .msg-avatar {
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
}

.msg.user .msg-avatar svg {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
}

.msg-body {
  max-width: 68%;
}

.msg-meta {
  font-size: 10.5px;
  color: var(--text-faint);
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.msg.user .msg-meta {
  flex-direction: row-reverse;
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 14.5px;
  line-height: 1.68;
  white-space: pre-wrap;
  word-break: break-word;
  position: relative;
}

.msg.ai .msg-bubble {
  background: var(--surface-raised);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text);
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, #1d4ed8, #6366f1);
  border-top-right-radius: 4px;
  color: #fff;
  box-shadow: 0 4px 20px rgba(99,102,241,0.35);
}

.msg-bubble code {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 12.5px;
  font-family: 'JetBrains Mono', monospace;
}

.msg.user .msg-bubble code {
  background: rgba(0,0,0,0.25);
}

/* Message image */
.msg-image {
  max-width: 100%;
  border-radius: 10px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  max-height: 260px;
  object-fit: contain;
  display: block;
}

/* Message actions */
.msg-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.msg:hover .msg-actions { opacity: 1; }

.msg.user .msg-actions { flex-direction: row-reverse; }

.msg-action-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  padding: 0;
}

.msg-action-btn img {
  width: 13px;
  height: 13px;
  object-fit: contain;
  filter: brightness(0.65);
  transition: filter 0.2s;
}

.msg-action-btn:hover {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.3);
}

.msg-action-btn:hover img {
  filter: brightness(1.1) sepia(1) hue-rotate(165deg) saturate(2);
}

.msg-action-btn:active { transform: scale(0.92); }

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 5px;
  padding: 14px 16px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  border-top-left-radius: 4px;
  width: fit-content;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: dot-pulse 1.3s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

@keyframes dot-pulse {
  0%,60%,100% { transform: translateY(0); opacity: 0.35; }
  30%          { transform: translateY(-7px); opacity: 1; }
}

/* ===================== INPUT AREA ===================== */
.input-area {
  padding: 16px 24px 20px;
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  animation: fade-up 0.6s cubic-bezier(0.22,1,0.36,1) 0.2s both;
}

/* Image preview */
.image-preview-wrap {
  display: none;
  margin-bottom: 10px;
}

.image-preview-wrap.active {
  display: block;
}

.image-preview-box {
  position: relative;
  display: inline-block;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
}

.image-preview-box img {
  max-width: 160px;
  max-height: 120px;
  object-fit: cover;
  display: block;
}

.btn-remove-image {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(8,12,18,0.8);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-size: 14px;
  line-height: 1;
}

.btn-remove-image:hover {
  background: rgba(248,113,113,0.2);
  color: var(--danger);
}

/* Input wrapper */
.input-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 10px 10px 10px 14px;
  transition: border-color 0.25s, box-shadow 0.25s;
}

.input-box:focus-within {
  border-color: rgba(56,189,248,0.45);
  box-shadow: 0 0 0 3px rgba(56,189,248,0.08);
}

.btn-attach {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  padding: 0;
}

.btn-attach svg { width: 17px; height: 17px; }

.btn-attach:hover {
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

#user-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Urbanist', sans-serif;
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.5;
  resize: none;
  max-height: 130px;
  min-height: 22px;
  scrollbar-width: none;
}

#user-input::-webkit-scrollbar { display: none; }

#user-input::placeholder {
  color: var(--text-faint);
}

.btn-send {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.25s;
  box-shadow: 0 2px 14px var(--accent-glow);
  padding: 0;
}

.btn-send svg { width: 14px; height: 14px; }

.btn-send:hover {
  opacity: 0.88;
  transform: translateY(-2px);
  box-shadow: 0 5px 20px var(--accent-glow);
}

.btn-send:active { transform: translateY(0); }

.btn-send:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.input-hint {
  font-size: 10.5px;
  color: var(--text-faint);
  text-align: center;
  margin-top: 9px;
  letter-spacing: 0.2px;
}

.input-hint kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--text-muted);
}

/* ===================== MOBILE ===================== */
@media (max-width: 768px) {
  :root { --sidebar-w: 272px; }

  .app {
    grid-template-columns: 1fr;
  }

  .menu-btn {
    display: flex;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100dvh;
    z-index: 1000;
    transform: translateX(-110%);
    transition: transform 0.32s cubic-bezier(0.22,1,0.36,1);
    will-change: transform;
    animation: none;
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: 24px 0 80px rgba(0,0,0,0.65);
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    background: transparent;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    backdrop-filter: blur(0px);
  }

  .sidebar-overlay.active {
    opacity: 1;
    pointer-events: auto;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
  }

  body.sidebar-open { overflow: hidden; }

  .welcome-screen h1 { font-size: 26px; }

  .msg-body { max-width: 88%; }

  .messages { padding: 20px 16px; }

  .input-area { padding: 14px 16px 18px; }

  .chat-header { padding: 14px 16px; }

  #clock { display: none; }
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: 20px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow-md);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-layer"></div>

<div id="toast" class="toast"></div>

<div class="app">

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div class="logo-info">
          <div class="logo-name">NOVA AI</div>
          <div class="logo-sub">Powered by Llama 3.3</div>
        </div>
      </div>

      <button class="btn-new-chat" onclick="createNewChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Chat
      </button>
    </div>

    <div class="chat-history" id="chat-history">
      <!-- Populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="icon-btn" title="Search" onclick="showToast('Search coming soon')">
        <img src="searchbutton.png" alt="Search">
      </button>
      <div class="sidebar-footer-fill"></div>
      <button class="icon-btn" title="Settings" onclick="showToast('Settings coming soon')">
        <img src="settingsbutton.png" alt="Settings">
      </button>
    </div>

  </aside>

  <!-- ==================== MAIN ==================== -->
  <main class="main-area">

    <header class="chat-header">
      <div class="header-left">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="chat-title-text" id="current-chat-title">New Chat</span>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <div class="status-dot"></div>
          Online
        </div>
        <div id="clock"></div>
      </div>
    </header>

    <div class="messages" id="messages">
      <!-- Welcome screen rendered by JS -->
    </div>

    <div class="input-area">
      <div class="image-preview-wrap" id="image-preview-wrap">
        <div class="image-preview-box">
          <img id="preview-img" src="" alt="Attachment preview">
          <button class="btn-remove-image" onclick="clearImage()" aria-label="Remove image">&times;</button>
        </div>
      </div>

      <div class="input-box">
        <input type="file" id="img-input" accept="image/*" style="display:none">

        <button class="btn-attach" onclick="document.getElementById('img-input').click()" title="Attach image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <textarea id="user-input" placeholder="Send a message..." rows="1"></textarea>

        <button id="send-btn" class="btn-send" onclick="sendMessage()" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

      <div class="input-hint">
        <kbd>Enter</kbd> to send &nbsp;&middot;&nbsp; <kbd>Shift+Enter</kbd> for new line
      </div>
    </div>

  </main>
</div>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
// ===================== CONFIG =====================
const SERVER = "https://nova-ai-5-bdi8.onrender.com/";

// ===================== STATE =====================
let chats = [];
let currentChatId = null;
let isLoading = false;
let selectedImage = null;

// ===================== INIT =====================
function init() {
  try {
    const saved = localStorage.getItem('nova_chats');
    if (saved) chats = JSON.parse(saved);
    const savedId = localStorage.getItem('nova_current_chat');
    if (savedId) currentChatId = savedId;
  } catch (e) {
    chats = [];
    currentChatId = null;
  }

  updateClock();
  setInterval(updateClock, 1000);
  initCanvas();
  renderChatList();

  if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
    createNewChat();
  } else {
    loadChat(currentChatId);
  }
}

// ===================== CLOCK =====================
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

// ===================== CANVAS =====================
function initCanvas() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const isMobile = window.innerWidth < 768;
  const count = isMobile ? 20 : 38;
  let lastFrame = 0;
  const fpsInterval = 1000 / 30;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = Array.from({ length: count }, () => ({
    x:   Math.random() * canvas.width,
    y:   Math.random() * canvas.height,
    r:   Math.random() * 1.1 + 0.3,
    dx:  (Math.random() - 0.5) * 0.22,
    dy:  (Math.random() - 0.5) * 0.22,
    op:  Math.random() * 0.35 + 0.1,
    col: Math.random() > 0.5 ? '56,189,248' : '99,102,241'
  }));

  function draw(ts) {
    requestAnimationFrame(draw);
    if (ts - lastFrame < fpsInterval) return;
    lastFrame = ts;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) {
      p.x = (p.x + p.dx + canvas.width)  % canvas.width;
      p.y = (p.y + p.dy + canvas.height) % canvas.height;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.col},${p.op})`;
      ctx.fill();
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.hypot(dx, dy);
        if (d < 95) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(56,189,248,${0.055 * (1 - d / 95)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  requestAnimationFrame(draw);
}

// ===================== TOAST =====================
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ===================== CHAT MANAGEMENT =====================
function createNewChat() {
  const id = 'chat_' + Date.now();
  chats.unshift({ id, title: 'New Chat', messages: [], createdAt: Date.now(), updatedAt: Date.now() });
  saveChats();
  currentChatId = id;
  localStorage.setItem('nova_current_chat', id);
  renderChatList();
  loadChat(id);
}

function loadChat(id) {
  currentChatId = id;
  localStorage.setItem('nova_current_chat', id);

  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  document.getElementById('current-chat-title').textContent = chat.title;

  const container = document.getElementById('messages');
  container.innerHTML = '';

  if (chat.messages.length === 0) {
    renderWelcome();
  } else {
    chat.messages.forEach(m => appendMessage(m.role, m.content, m.image || null));
  }

  renderChatList();
  scrollBottom();

  // Close sidebar on mobile
  if (window.innerWidth <= 768) closeSidebar();
}

function deleteChat(id) {
  if (!confirm('Delete this conversation?')) return;
  chats = chats.filter(c => c.id !== id);
  saveChats();

  if (currentChatId === id) {
    chats.length ? loadChat(chats[0].id) : createNewChat();
  }
  renderChatList();
}

function saveChats() {
  try { localStorage.setItem('nova_chats', JSON.stringify(chats)); } catch (e) {}
}

function getChat() { return chats.find(c => c.id === currentChatId); }

function setChatTitle(id, title) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  chat.title = title.slice(0, 52);
  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
  if (id === currentChatId) {
    document.getElementById('current-chat-title').textContent = chat.title;
  }
}

// ===================== CHAT LIST RENDER =====================
function renderChatList() {
  const container = document.getElementById('chat-history');
  const now = Date.now();
  const dayMs = 86400000;
  const todayStart = new Date().setHours(0,0,0,0);

  const groups = [
    { label: 'Today',     items: chats.filter(c => c.updatedAt >= todayStart) },
    { label: 'Yesterday', items: chats.filter(c => c.updatedAt >= todayStart - dayMs && c.updatedAt < todayStart) },
    { label: 'Earlier',   items: chats.filter(c => c.updatedAt < todayStart - dayMs) }
  ];

  container.innerHTML = groups
    .filter(g => g.items.length)
    .map(g => `
      <div class="history-label">${g.label}</div>
      ${g.items.map(chat => {
        const t = new Date(chat.updatedAt);
        const time = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
        return `
          <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="loadChat('${chat.id}')">
            <div class="chat-item-info">
              <div class="chat-item-title">${esc(chat.title)}</div>
              <div class="chat-item-time">${time}</div>
            </div>
            <button class="btn-delete-chat" onclick="event.stopPropagation();deleteChat('${chat.id}')" aria-label="Delete chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </div>
        `;
      }).join('')}
    `).join('');
}

// ===================== MESSAGES =====================
function renderWelcome() {
  document.getElementById('messages').innerHTML = `
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-orb"></div>
      <h1>Hello, I'm NOVA AI</h1>
      <p>Your next-generation intelligent assistant. Ask anything or upload an image to get started.</p>
      <div class="suggestions-grid">
        <div class="suggestion-chip" onclick="useSuggestion(this)">Explain quantum computers</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">Write a Python sorting algorithm</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">Suggest a startup name</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">Tell me about black holes</div>
      </div>
    </div>
  `;
}

function useSuggestion(el) {
  const ta = document.getElementById('user-input');
  ta.value = el.textContent.trim();
  ta.dispatchEvent(new Event('input'));
  ta.focus();
}

function esc(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

function appendMessage(role, content, imageData = null) {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const container = document.getElementById('messages');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const isAI = role === 'ai' || role === 'assistant';

  const imageHtml = imageData
    ? `<img src="${imageData}" class="msg-image" alt="Attached image">`
    : '';

  // Action buttons
  const actionsHtml = isAI ? `
    <div class="msg-actions">
      <button class="msg-action-btn" title="Copy" onclick="copyMessage(this)">
        <img src="copybutton.png" alt="Copy">
      </button>
      <button class="msg-action-btn" title="Regenerate" onclick="regenerateMessage(this)">
        <img src="regenerationbutton.png" alt="Regenerate">
      </button>
    </div>
  ` : '';

  const avatarAI = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>`;

  const avatarUser = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>`;

  const el = document.createElement('div');
  el.className = `msg ${isAI ? 'ai' : 'user'}`;
  el.dataset.content = content;
  el.innerHTML = `
    <div class="msg-avatar">${isAI ? avatarAI : avatarUser}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span>${isAI ? 'NOVA AI' : 'You'}</span>
        <span>${time}</span>
      </div>
      <div class="msg-bubble">
        ${imageHtml}${esc(content)}
      </div>
      ${actionsHtml}
    </div>
  `;

  container.appendChild(el);
  scrollBottom();
  return el;
}

function showTyping() {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const container = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.id = 'typing-msg';

  const avatarSVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>`;

  el.innerHTML = `
    <div class="msg-avatar">${avatarSVG}</div>
    <div class="msg-body">
      <div class="msg-meta"><span>NOVA AI</span></div>
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;

  container.appendChild(el);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

function scrollBottom() {
  const container = document.getElementById('messages');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 60);
}

// Message actions
function copyMessage(btn) {
  const msgEl = btn.closest('.msg');
  const text = msgEl?.dataset?.content || '';
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
}

function regenerateMessage(btn) {
  if (isLoading) return;
  const chat = getChat();
  if (!chat || chat.messages.length < 2) return;

  // Remove last assistant message
  const lastIdx = [...chat.messages].reverse().findIndex(m => m.role === 'assistant' || m.role === 'ai');
  if (lastIdx === -1) return;
  const realIdx = chat.messages.length - 1 - lastIdx;
  chat.messages.splice(realIdx, 1);

  // Remove it from DOM
  const msgs = document.getElementById('messages');
  const msgEls = msgs.querySelectorAll('.msg.ai');
  const lastAI = msgEls[msgEls.length - 1];
  if (lastAI) lastAI.remove();

  // Get the last user message to resend
  const lastUserMsg = [...chat.messages].reverse().find(m => m.role === 'user');
  if (!lastUserMsg) return;

  saveChats();
  callAPI(chat, lastUserMsg.content, null);
}

// ===================== IMAGE HANDLING =====================
document.getElementById('img-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    selectedImage = ev.target.result;
    document.getElementById('preview-img').src = selectedImage;
    document.getElementById('image-preview-wrap').classList.add('active');
  };
  reader.readAsDataURL(file);
});

function clearImage() {
  selectedImage = null;
  document.getElementById('img-input').value = '';
  document.getElementById('image-preview-wrap').classList.remove('active');
}

// ===================== TEXTAREA =====================
const textarea = document.getElementById('user-input');

textarea.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});

textarea.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===================== SEND MESSAGE =====================
async function sendMessage() {
  if (isLoading) return;

  const text  = (textarea.value || '').trim();
  const image = selectedImage;

  if (!text && !image) return;

  const chat = getChat();
  if (!chat) return;

  const userMsg = { role: 'user', content: text, image: image ? true : null, timestamp: Date.now() };
  chat.messages.push(userMsg);

  if (chat.messages.length === 1 && text) setChatTitle(chat.id, text);

  appendMessage('user', text, image);

  textarea.value = '';
  textarea.style.height = 'auto';
  const imageCopy = image;
  clearImage();

  await callAPI(chat, text, imageCopy);
}

async function callAPI(chat, text, image) {
  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const res = await fetch(`${SERVER}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        history: chat.messages.slice(-20).map(m => ({ role: m.role, content: m.content || '' })),
        has_image: !!image
      })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);

    const reply = data.reply?.trim() || 'No response received.';

    chat.messages.push({ role: 'assistant', content: reply, timestamp: Date.now() });
    chat.updatedAt = Date.now();
    if (chat.messages.length > 100) chat.messages = chat.messages.slice(-100);
    saveChats();

    hideTyping();
    appendMessage('ai', reply);

  } catch (err) {
    hideTyping();
    appendMessage('ai', `Connection error:\n\n${err.message}`);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    textarea.focus();
  }
}

// ===================== SIDEBAR (MOBILE) =====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('active');
  document.body.classList.toggle('sidebar-open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('active');
  document.body.classList.remove('sidebar-open');
}

// ===================== BOOT =====================
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
